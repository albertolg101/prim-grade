[project]
name = "primgrade-server"
version = "0.1.0"
description = "PrimGrade platform API (PL-01–35); uses the grader library, which never imports it"
requires-python = ">=3.12"
dependencies = [
    "primgrade",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.uv.sources]
primgrade = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["primgrade_server", "primgrade_server.routes"]
